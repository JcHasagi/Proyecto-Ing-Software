<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/plantilla :: cabecera('Error')}"></head>
<body class="app">
<aside th:replace="~{fragments/plantilla :: lateral(null)}"></aside>
<header th:replace="~{fragments/plantilla :: superior(null, null, null, null)}"></header>

<main class="contenido">
    <section class="panel mensaje-error">
        <span class="mensaje-error__codigo" th:text="${status}">404</span>
        <h1 th:switch="${status}">
            <span th:case="403">No tienes permiso para ver esta página</span>
            <span th:case="404">Página no encontrada</span>
            <span th:case="*">Algo salió mal</span>
        </h1>
        <p><a class="boton boton--contorno" th:href="@{/catalogo}">Ir al catálogo</a></p>
    </section>
</main>

<footer th:replace="~{fragments/plantilla :: pie}"></footer>
</body>
</html>
