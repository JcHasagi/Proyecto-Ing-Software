spring.application.name=siminversion

# Base de datos MySQL. Las credenciales llegan por variables de entorno, nunca en el repositorio.
spring.datasource.url=${SIMINVERSION_DB_URL:jdbc:mysql://localhost:3306/siminversion?rewriteBatchedStatements=true}
spring.datasource.username=${SIMINVERSION_DB_USUARIO:siminversion}
spring.datasource.password=${SIMINVERSION_DB_CONTRASENA:}

# El esquema lo controla Flyway (src/main/resources/db/migration); Hibernate solo lo valida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# La sesion expira tras 30 minutos de inactividad.
server.servlet.session.timeout=30m

# Carga masiva de historicos (REQ-018).
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Carga inicial: SIMBOLO.csv de esta carpeta para cada instrumento sin precios (ver datos/historico/FUENTES.md).
siminversion.historico.directorio=${SIMINVERSION_HISTORICO_DIR:datos/historico}

# Cuenta de ahorro (REQ-013): tasa nominal anual de las cuentas nuevas.
siminversion.ahorro.tasa-anual=0.04

# Administrador inicial: se crea al arrancar si ambas variables tienen valor y el correo no existe.
siminversion.admin.correo=${SIMINVERSION_ADMIN_CORREO:}
siminversion.admin.contrasena=${SIMINVERSION_ADMIN_CONTRASENA:}
