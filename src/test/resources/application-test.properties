# Pruebas: H2 en memoria en modo MySQL; Flyway aplica las mismas migraciones que en MySQL.
spring.datasource.url=jdbc:h2:mem:siminversion;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Las pruebas empiezan sin precios; cada una inserta los suyos.
siminversion.historico.directorio=

# Que las variables de entorno del equipo no creen un administrador durante las pruebas.
siminversion.admin.correo=
siminversion.admin.contrasena=
